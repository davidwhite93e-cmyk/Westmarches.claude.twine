name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate twee (links, macros, JS, references)
        run: python3 tools/validate.py

      - name: Extract Story JavaScript and check syntax
        run: python3 tools/extract_js.py && node --check build/check.js
